name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # TEST-ONLY sign-in credentials for the build and the Playwright run.
      # Not real secrets; never use them on a deployed site. They must match
      # e2e/support/test-credentials.ts (the test password is in that file).
      ADMIN_EMAIL: founder@example.test
      ADMIN_PASSWORD_HASH: scrypt$32768$8$1$CUDnCcpP3PW/111lcw8oeQ==$Sx3j9M02rMDNxlpkWtI6M/my57xpBoMcsLxVaE8kwmg=
      AUTH_SECRET: test-only-auth-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Unit and component tests (TZ=UTC)
        run: pnpm test

      - name: Unit and component tests again (TZ=America/Chicago)
        run: pnpm test:tz

      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke (a retry may not hide a flake)
        run: pnpm test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
